name: Daily Market Brief

on:
  schedule:
    # 매일 KST 오전 8시 30분 = UTC 23:30 (전날)
    # 정각(00분)은 GitHub Actions 혼잡 시간이라 30분 오프셋으로 지연 최소화
    - cron: "30 23 * * *"
  workflow_dispatch:  # 수동 실행 허용

permissions:
  contents: write  # data/*.json 커밋용

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch_market.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fetch_market.py

      - name: Commit data snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: $(date -u +%Y-%m-%d) snapshot"
            git push
          fi
